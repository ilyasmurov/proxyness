# Proxyness host nginx — SNI router on :443.
#
# Installed by scripts/vps/provision.sh as /etc/nginx/nginx.conf.
#
# One public TLS port carries two very different things: the proxy protocol
# (the container terminates its own TLS on 4430) and the admin SPA (TLS
# terminated here on 8444 with the Let's Encrypt cert, then plain HTTP to the
# admin container on 8081). The stream block peeks the SNI and routes; it
# never decrypts proxy traffic. UDP 443/8443 does not pass through nginx at
# all — stream is TCP-only and the proxy container publishes 8443/udp itself.
#
# Port 80 is deliberately NOT bound here: the proxyness-landing container owns
# it, and certbot's standalone renewal borrows it via the pre/post hooks in
# /etc/letsencrypt/renewal-hooks (see scripts/vps/certbot-hooks).
#
# The admin cert lives at /etc/nginx/ssl/admin/ — a self-signed placeholder at
# provisioning time, replaced by the deploy hook once certbot has issued the
# real one. Pointing nginx straight at /etc/letsencrypt/live would make nginx
# refuse to start on a fresh host where no cert exists yet.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 8192;
}

stream {
    map $ssl_preread_server_name $proxyness_upstream {
        admin.proxyness.smurov.com 127.0.0.1:8444;
        default                    127.0.0.1:4430;
    }

    server {
        listen 443 reuseport;
        ssl_preread on;
        proxy_pass $proxyness_upstream;
        proxy_connect_timeout 5s;
        # Proxy sessions are long-lived TCP relays; the default 10m idle
        # timeout would cut quiet-but-alive client connections.
        proxy_timeout 12h;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /var/log/nginx/access.log;

    server {
        listen 127.0.0.1:8444 ssl;
        server_name admin.proxyness.smurov.com;

        ssl_certificate     /etc/nginx/ssl/admin/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/admin/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
