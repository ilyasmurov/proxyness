# TCP accept-path tuning for the proxy host.
#
# Installed at /etc/sysctl.d/99-proxyness-tcp.conf.
#
# Why: the host was dropping SYNs when the accept path backed up — `netstat -s`
# showed tens of thousands of "listen queue of a socket overflowed" and "SYNs to
# LISTEN sockets dropped" over one uptime. That failure looks like a dead server
# from the outside (existing connections keep working, new ones time out) while
# the box is idle and the link is nearly empty.
#
# The default tcp_max_syn_backlog of 128 is the half-open queue: too small for a
# host fielding proxy clients that each open many short-lived TLS connections.
# somaxconn is already 4096; matching the two keeps the accept path consistent.
net.ipv4.tcp_max_syn_backlog = 4096
net.core.somaxconn = 4096
