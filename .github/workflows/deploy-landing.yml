name: Deploy Landing

on:
  push:
    tags: ["landing-*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy to this matrix target only (aeza, control, timeweb-ams); empty = every host"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-landing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: landing
          file: landing/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Every host gets every deploy; fail-fast is off so one dead host cannot
    # block the others — its leg just stays red. Targets:
    #   aeza     — exit (VPN traffic), Aeza NL 178.236.252.28
    #   control  — control plane on the shared Ansamblist box (FirstVDS, RU):
    #              admin API + config service + landing + primary Postgres,
    #              never an exit. Caddy in front → landing publishes 8082, not 80.
    #   timeweb-ams — exit, Timeweb Cloud Amsterdam (PRXNS-25); same CI deploy
    #              key as aeza, hence VPS2_SSH_KEY.
    # Serverspace (VPS_HOST / VPS_SSH_KEY) was dropped on 2026-09-15 — the host
    # went dark and its leg only painted every run red; re-add the line if it
    # ever returns (see deploy.md runbook).
    # A manual run can target one host (input `target`): that is how a new exit
    # is brought up without restarting the containers on the others.
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: aeza, host: VPS2_HOST, key: VPS2_SSH_KEY, landing_port: 80 }
          - { name: control, host: VPS3_HOST, key: VPS3_SSH_KEY, landing_port: 8082 }
          - { name: timeweb-ams, host: VPS4_HOST, key: VPS2_SSH_KEY, landing_port: 80 }
    name: ${{ matrix.target.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        if: ${{ !inputs.target || inputs.target == matrix.target.name }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets[matrix.target.host] }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets[matrix.target.key] }}
          script: |
            set -euo pipefail
            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin

            # Pull with retries — see deploy.yml for rationale.
            PULL_OK=0
            for ATTEMPT in 1 2 3 4 5; do
              echo "[pull] attempt $ATTEMPT/5..."
              if docker pull ghcr.io/${{ github.repository }}-landing:latest; then
                PULL_OK=1; break
              fi
              sleep 30
            done
            [ "$PULL_OK" -eq 1 ] || { echo "[pull] FAILED after 5 attempts" >&2; exit 1; }

            # Stop and remove old container
            docker stop proxyness-landing 2>/dev/null || true
            docker rm proxyness-landing 2>/dev/null || true

            # Start new container
            docker run -d \
              --name proxyness-landing \
              --restart unless-stopped \
              -p ${{ matrix.target.landing_port }}:80 \
              ghcr.io/${{ github.repository }}-landing:latest
